<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale-1.0" />
        <title>Twilight Bloom</title>
        <!--CSS link-->>
        <link rel="stylesheet" href="style.css">
        <!--BoxIcons-->>
        <link 
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" 
        rel="stylesheet"
        />
    </head>
    <body>
    <!-- Header-->
     <header>
        <!--Nav-->
        <div class="nav container">
        <!--Loggo-->
        <a href="#" class="logo">Twilight Bloom</a>
        <!--Navbar-->
        <div class="navbar">
            <li><a href="#" class="nav-link">About Us</a></li>
            <li><a href="#" class="nav-link">Services</a></li>
            <li><a href="#" class="nav-link">Package</a></li>
            <li><a href="#" class="nav-link">Testimonial</a></li>
            <li><a href="#" class="nav-link">Contact Us</a></li>
            <a href="#" class="register-btn btn">Register</a>
        </div>
        <!--MenuIcon-->
        <div class="menu-icon">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
     </header>
    <!--Home-->
    <section class="home" id="home">
        <div class="home-data container">
            <!--HomeText-->
            <div class="home-text">
                <h3>We can help you to</h3>
                <h2>Reveal Your <br> 
                    Natural <br />
                    Beauty Skin
                </h2>
                <div class="home-btns">
                    <a href="#" class="book-btn btn">Book Now</a>
                    <a href="#" class="explore-btn btn">Explore</a>
                </div>
                <!--HomeIMage-->
                <div class="home-img">
                    <img src="images/img1ClearSkin.jpg" alt="Clear Skin Image" />
                </div>
                <!--ContactInfo-->
                <div class="contact-info">
                    <div class="contact-info-box">
                        <i class='bx bxs-map'></i>
                        <span>2nd Street, 5th Avenue, NYC, USA</span>
                    </div>
                    <div class="contact-info-box">
                        <i class='bx bxs-phone'></i>
                        <span>(444)555-666</span>
                    </div>
                    <div class="contact-info-box">
                        <i class='bx bxs-envelope'></i>
                        <span>info@twilightbloom.com</span>
                    </div>
                </div>
            </div>
            <!--2ndHomeIMage for make mobile responsive-->
            <div class="home-bg">
                <img src="images/img1ClearSkin.jpg" alt="Clear Skin Image">
            </div>

        </div>
    </section>
     <!--Link To Js-->
     <script src="main.js"></script>
    </body>
    </html>
